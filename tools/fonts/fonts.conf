<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- A23: fontconfig for build-time rendering (tools/og.mjs sets FONTCONFIG_FILE to this file before sharp
     loads). Only the brand instances in this directory are visible, so the card text cannot silently fall back
     to a system face. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir prefix="relative">../../.cache/fontconfig</cachedir>
  <config><rescan><int>0</int></rescan></config>
</fontconfig>
